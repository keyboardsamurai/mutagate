  MaxEdits = 3
  MaxStops = 3
  MaxRounds = 2
  Revert = TRUE
INVARIANT SilentStopMeansPassOnTheseFiles
INVARIANT UsableResultIsOfTheseFiles
INVARIANT BelowBlocksBeforeStop
INVARIANT BlocksAreBounded
INVARIANT GoalNeverStopsClean
