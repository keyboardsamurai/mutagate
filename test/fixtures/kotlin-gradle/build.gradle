plugins { id 'org.jetbrains.kotlin.jvm' version '2.1.21' }
repositories { mavenCentral() }
dependencies { testImplementation 'junit:junit:4.13.2'  }
java { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
kotlin { jvmToolchain(21) }; tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11 }
