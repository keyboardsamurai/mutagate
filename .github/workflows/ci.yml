name: deterministic and runner tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:installer
      - run: npm install --prefix test/.cache/opencode --no-audit --no-fund opencode-ai@1.18.30
        if: runner.os == 'Linux'
      - run: npm run test:opencode-discovery
        if: runner.os == 'Linux'
        env:
          MUTAGATE_OPENCODE_BIN: ${{ github.workspace }}/test/.cache/opencode/node_modules/.bin/opencode
  jvm:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MUTAGATE_TEST_ENTRY: mutagate-hook.cjs
      MUTAGATE_FIXTURES: ${{ matrix.os == 'windows-latest' && 'java-gradle' || 'java-maven,java-gradle,java-gradle-multimodule,kotlin-gradle,kotlin-java-mixed' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14.3'
      - run: npm run test:integration
      - run: npm run test:driver
        if: runner.os != 'Windows'
  tier2:
    runs-on: ubuntu-latest
    env:
      MUTAGATE_TEST_ENTRY: mutagate-hook.cjs
      MUTAGATE_FIXTURES: python-pip,python-uv,ts-jest,ts-vitest,go-module,dotnet-xunit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.x' }
      - run: go install github.com/szhekpisov/gomutants@v0.6.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '10.0.x' }
      - run: |
          dotnet tool install dotnet-stryker --tool-path "$RUNNER_TEMP/dotnet-tools" --version 5.0.0
          echo "$RUNNER_TEMP/dotnet-tools" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: |
          uv venv test/.cache/py2 --python 3.12
          uv pip install --python test/.cache/py2/bin/python 'mutmut==2.5.1' 'pytest==8.4.2'
          uv sync --project test/fixtures/python-uv --python 3.12 --frozen
          npm ci --prefix test/fixtures/ts-jest
          npm ci --prefix test/fixtures/ts-vitest
      - run: npm run test:integration
